name: Deploy to Dev

on:
  push:
    branches:
      - dev-version
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm 11+ needs Node >= 22.13; `version: latest` also drifted from package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Create frontend .env
        run: echo "${{ secrets.FRONTEND_ENV }}" > ./frontend/.env.staging

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build staging
        working-directory: frontend
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest backend code on server
        # The remote restart script only runs `poetry install` + `migrate` against
        # whatever code is checked out on disk; it does NOT fetch from origin.
        # Without this step, backend changes pushed to `dev-version` would
        # never reach the server. We fetch and hard-reset to origin/dev-version
        # so the deployed tree always matches the branch that just triggered the
        # workflow. Untracked files (e.g. frontend/build/, db/, .env) are left
        # untouched by `git reset --hard`.
        #
        # Scoped `git clean -fdx backend/core/migrations/` sweeps any stray
        # migration files (and their __pycache__) that may have been generated
        # on the host — for example by a stray `manage.py makemigrations` run
        # in a previous deploy. These show up as untracked leaf-node migrations
        # and break `migrate` with "Conflicting migrations detected". Restricting
        # the clean to that one directory keeps it safe against frontend/build/,
        # db/, .env, and other untracked deploy artifacts.
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ~/ciso-dev/ciso-assistant-community && \
             git fetch origin dev-version && \
             git reset --hard origin/dev-version && \
             git clean -fdx backend/core/migrations/ && \
             git log -1 --pretty=oneline"

      - name: Copy build to server
        run: |
          # --delete removes stale chunks from previous builds so no old
          # compiled code (e.g. obsolete API URLs) lingers on the server.
          # Target the frontend/build/ directory explicitly so --delete
          # cannot touch anything outside of build/.
          # Runs AFTER the git reset so the freshly-built CI artifacts win
          # over whatever stale build/ may exist on the server.
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /home/mansourmuhammad37/ciso-dev/ciso-assistant-community/frontend/build"
          rsync -az --delete --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./frontend/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/mansourmuhammad37/ciso-dev/ciso-assistant-community/frontend/build/

      - name: Run remote start script
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash ~/ciso-dev/ciso-assistant-community/start-pm2.sh restart"
