<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <style>
      .wathbah-dark { fill: #0B1F3A; }
      .wathbah-blue { fill: #1A56DB; }
      .wathbah-subtitle { fill: #0B1F3A; font-family: 'Cairo', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>
  
  <!-- Stylized W mark -->
  <g transform="translate(52, 20)">
    <!-- W letter form -->
    <polygon class="wathbah-dark" points="0,10 25,130 50,50 75,130 95,10 80,10 65,105 50,50 50,45 35,105 15,10"/>
    <!-- Blue ascending accent stroke -->
    <polygon class="wathbah-blue" points="75,130 95,10 108,10 100,0 80,10 65,105"/>
  </g>
  
  <!-- WATHBAH text -->
  <text x="200" y="195" text-anchor="middle" class="wathbah-dark" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="8">WATHBAH</text>
  
  <!-- Arabic subtitle -->
  <text x="200" y="245" text-anchor="middle" class="wathbah-subtitle" font-size="26" font-weight="600" direction="rtl">وثبـة لحلول الذكاء الاصطناعي</text>
  
  <!-- English subtitle -->
  <text x="200" y="280" text-anchor="middle" class="wathbah-subtitle" font-size="22" font-weight="400" letter-spacing="2">Wathbah AI Solutions</text>
</svg>
