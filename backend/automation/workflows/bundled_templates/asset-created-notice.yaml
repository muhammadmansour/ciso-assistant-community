urn: urn:custom:risk:library:workflow-asset-created-notice
locale: en
ref_id: workflow-asset-created-notice
name: Asset created → notify asset owners mailbox | إنشاء أصل → إبلاغ بريد الأصول
version: 1
description: When an asset is created, email the asset owners mailbox with the name, type, and a link.
objects:
  workflows:
  - schema_version: 1
    name: Asset created → notify asset owners mailbox | إنشاء أصل → إبلاغ بريد الأصول
    ref_id: asset-created-notice
    description: When an asset is created, email the asset owners mailbox with the name, type, and a link.
    graph:
      variables:
      - key: object_id
        type: string
        default_value: ''
      - key: app_url
        type: string
        default_value: ''
      - key: notify_mailbox
        type: string
        default_value: 'assets@example.com'
      nodes:
      - ref: on_create
        type: trigger
        label: Event | حدث
        trigger_config:
          type: internal_event
          event_key: asset.created
      - ref: run_now
        type: trigger
        label: Run for one record | تشغيل لسجل محدد
        trigger_config:
          type: manual
        input_mapping:
          object_id: object_id
      - ref: take_payload
        type: action
        label: Capture id | التقاط المعرّف
        action_config:
          type: set_variables
          variables:
            object_id: '{{payload.object_id}}'
      - ref: read_object
        type: action
        label: Read record | قراءة السجل
        action_config:
          type: read_objects
          model: asset
          mode: first
          filters:
            operator: and
            conditions:
            - op: eq
              field: id
              value: '{{object_id}}'
      - ref: mail
        type: action
        label: Send email | إرسال بريد
        action_config:
          type: send_email
          recipients: '{{notify_mailbox}}'
          subject: 'New asset — {{nodes.read_object.object.name}}'
          body: 'Name | الاسم: {{nodes.read_object.object.name}} · Type | النوع: {{nodes.read_object.object.type}} · {{app_url}}/assets/{{object_id}}'
          layout:
            title: 'New asset'
            sections:
            - 'Automated notice from Muhkam | رسالة آلية من منصة محكم'
            details:
            - label: 'Name | الاسم'
              value: '{{nodes.read_object.object.name}}'
            - label: 'Type | النوع'
              value: '{{nodes.read_object.object.type}}'
            - label: 'Link | الرابط'
              value: '{{app_url}}/assets/{{object_id}}'
            buttons:
            - label: 'Open | فتح'
              url: '{{app_url}}/assets/{{object_id}}'
            footer: 'Automated message from Muhkam | رسالة آلية من منصة محكم'
      - ref: done
        type: end
      edges:
      - source: on_create
        target: take_payload
      - source: take_payload
        target: read_object
      - source: run_now
        target: read_object
      - source: read_object
        target: mail
      - source: mail
        target: done
    urn: urn:custom:risk:library:workflow-asset-created-notice:workflow:asset-created-notice
