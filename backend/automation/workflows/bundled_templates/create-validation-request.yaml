urn: urn:custom:risk:library:workflow-create-validation-request
locale: en
ref_id: workflow-create-validation-request
name: Create validation request | إنشاء طلب تحقق
version: 2
description: >
  Manually create a validation request assigned to an approver (by email),
  optionally linking applied controls, evidence, tasks, and policies, then
  email the approver a link to the request.
objects:
  workflows:
  - schema_version: 1
    name: Create validation request | إنشاء طلب تحقق
    ref_id: create-validation-request
    description: >
      Manually create a validation request for an approver, optionally linking
      applied controls, evidence, tasks, and policies, then email the approver.
    graph:
      variables:
      - key: approver_email
        type: string
        default_value: ''
      - key: request_notes
        type: string
        default_value: 'Please review and validate the linked items.'
      - key: validation_deadline
        type: string
        default_value: ''
      - key: applied_controls
        type: string
        default_value: ''
      - key: evidences
        type: string
        default_value: ''
      - key: task_templates
        type: string
        default_value: ''
      - key: policies
        type: string
        default_value: ''
      - key: app_url
        type: string
        default_value: ''
      nodes:
      - ref: run_now
        type: trigger
        label: Run | تشغيل
        trigger_config:
          type: manual
        input_mapping:
          approver_email: approver_email
          request_notes: request_notes
          validation_deadline: validation_deadline
          applied_controls: applied_controls
          evidences: evidences
          task_templates: task_templates
          policies: policies
      - ref: create_validation
        type: action
        label: Create validation | إنشاء التحقق
        action_config:
          type: create_object
          model: validation_flow
          fields:
            # Email resolves to the User row (approver FK) via identifier match.
            approver: '{{approver_email}}'
            request_notes: '{{request_notes}}'
            validation_deadline: '{{validation_deadline}}'
            applied_controls: '{{applied_controls}}'
            evidences: '{{evidences}}'
            task_templates: '{{task_templates}}'
            policies: '{{policies}}'
            # Avoid duplicate mail: Send email step below is the visible notice.
            skip_notification: '1'
      - ref: mail
        type: action
        label: Send email | إرسال بريد
        action_config:
          type: send_email
          recipients: '{{approver_email}}'
          subject: 'Validation request — {{nodes.create_validation.created_object_name}}'
          body: >-
            A validation request was submitted for your review.

            Notes | الملاحظات: {{request_notes}}

            Open | فتح: {{app_url}}/validation-flows/{{nodes.create_validation.created_object_id}}
          layout:
            title: 'Validation request'
            sections:
            - 'Automated notice from Muhkam | رسالة آلية من منصة محكم'
            details:
            - label: 'Reference | المرجع'
              value: '{{nodes.create_validation.created_object_name}}'
            - label: 'Notes | الملاحظات'
              value: '{{request_notes}}'
            - label: 'Link | الرابط'
              value: '{{app_url}}/validation-flows/{{nodes.create_validation.created_object_id}}'
            buttons:
            - label: 'Open validation | فتح التحقق'
              url: '{{app_url}}/validation-flows/{{nodes.create_validation.created_object_id}}'
            footer: 'Automated message from Muhkam | رسالة آلية من منصة محكم'
      - ref: done
        type: end
      edges:
      - source: run_now
        target: create_validation
      - source: create_validation
        target: mail
      - source: mail
        target: done
    urn: urn:custom:risk:library:workflow-create-validation-request:workflow:create-validation-request
