{% load i18n core_extras %}
<style>
    @page {
        size: A4 portrait;
        margin: 2.1cm 1.2cm 1.5cm 1.2cm;
        @top-left { content: element(reportHeader); width: 100%; }
        @bottom-left { content: element(reportFooter); }
        @bottom-right {
            content: "{% trans 'Page' %} " counter(page, {% num_counter_style %}) " / " counter(pages, {% num_counter_style %});
            font-family: 'Cairo', sans-serif;
            font-size: 7.5pt;
            color: #64748B;
        }
    }

    body { font-family: 'Cairo', sans-serif; color: #1E293B; font-size: 8.5pt; line-height: 1.45; }
    th { text-align: left; }
    ul { list-style: disc; padding-left: 0.45cm; margin: 0; }
    [dir="rtl"] { direction: rtl; text-align: right; }

    .report-header { position: running(reportHeader); width: 100%; }
    .report-header table { width: 100%; border-collapse: collapse; border-bottom: 2px solid #316FD3; }
    .report-header td { padding: 0 0 0.12cm 0; vertical-align: bottom; }
    .report-header img { height: 0.85cm; width: auto; }
    .report-header .title { text-align: right; font-size: 7.5pt; color: #64748B; }
    .report-header .title strong { color: #192A44; font-weight: 600; }
    .report-footer { position: running(reportFooter); font-size: 7.5pt; color: #64748B; }

    .muted { color: #94A3B8; }
    .small { font-size: 7.5pt; color: #64748B; }
    .eyebrow { font-size: 8pt; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #316FD3; margin: 0; }
    h1.report-title { font-size: 21pt; font-weight: 700; color: #192A44; margin: 0.05cm 0 0 0; line-height: 1.2; }
    .report-subtitle { font-size: 10.5pt; color: #475569; margin: 0.05cm 0 0.3cm 0; }
    .description { margin: 0.25cm 0 0 0; color: #334155; }

    .chapter { page-break-before: always; }
    .chapter-band { background: #192A44; color: #FFFFFF; border-radius: 5px; padding: 0.16cm 0.35cm; margin: 0 0 0.25cm 0; page-break-after: avoid; }
    .chapter-band .num { color: #93C5FD; font-weight: 700; margin-right: 0.2cm; }
    .chapter-band .name { font-weight: 700; font-size: 11pt; }
    .chapter-band .stats { float: right; font-size: 7.5pt; color: #CBD5E1; padding-top: 0.1cm; }
    h2.block-title { font-size: 11pt; font-weight: 700; color: #192A44; margin: 0.3cm 0 0.12cm 0; page-break-after: avoid; }
    h3.sub-title { font-size: 9pt; font-weight: 700; color: #316FD3; margin: 0.3cm 0 0.12cm 0; page-break-after: avoid; }

    table.meta { width: 100%; border-collapse: separate; border-spacing: 0; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; }
    table.meta td { padding: 0.16cm 0.3cm; vertical-align: top; width: 25%; }
    table.meta .label { display: block; font-size: 7pt; text-transform: uppercase; letter-spacing: 0.05em; color: #64748B; }
    table.meta .value { display: block; font-weight: 600; color: #192A44; }

    table.kpis { width: 100%; border-collapse: separate; border-spacing: 0.25cm 0; margin: 0.3cm -0.25cm 0 -0.25cm; }
    table.kpis td { border: 1px solid #E2E8F0; border-top: 3px solid #316FD3; border-radius: 6px; padding: 0.2cm 0.3cm; background: #FFFFFF; }
    table.kpis td.alert { border-top-color: #DC2626; }
    table.kpis .kpi-value { font-size: 16pt; font-weight: 700; color: #192A44; line-height: 1.15; white-space: nowrap; }
    table.kpis .kpi-label { font-size: 7.5pt; color: #64748B; }

    .attention { margin-top: 0.3cm; border: 1px solid #FDE68A; background: #FFFBEB; border-radius: 6px; padding: 0.2cm 0.35cm; }
    .attention .title { font-weight: 700; color: #92400E; margin-bottom: 0.08cm; }
    .attention li { margin: 0 0 0.04cm 0; color: #78350F; }
    .attention.ok { border-color: #BBF7D0; background: #F0FDF4; }
    .attention.ok .title { color: #166534; }

    .bar { width: 100%; height: 0.36cm; border-radius: 4px; overflow: hidden; background: #E2E8F0; }
    .bar table { width: 100%; height: 0.36cm; border-collapse: collapse; }
    .bar td { padding: 0 !important; border: none !important; height: 0.36cm; }
    .legend { margin-top: 0.12cm; }
    .legend span.item { display: inline-block; margin-right: 0.45cm; font-size: 7.5pt; color: #334155; }
    .swatch { display: inline-block; width: 0.22cm; height: 0.22cm; border-radius: 2px; vertical-align: -0.02cm; margin-right: 0.08cm; }

    table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.grid thead th { background: #EEF3FB; color: #192A44; font-size: 7pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.1cm 0.15cm; border-bottom: 1px solid #C7D5EE; }
    table.grid td { padding: 0.11cm 0.15cm; vertical-align: top; border-bottom: 1px solid #E2E8F0; font-size: 8pt; word-wrap: break-word; }
    table.grid tr { page-break-inside: avoid; }
    table.grid tbody tr:nth-child(even) td { background: #FAFBFD; }
    table.grid .num { text-align: right; }
    table.grid .strong { font-weight: 600; color: #192A44; }
    /* Portrait pages leave little room for wide tables. */
    table.grid.dense thead th { font-size: 6.3pt; padding: 0.08cm 0.1cm; }
    table.grid.dense td { font-size: 7pt; padding: 0.08cm 0.1cm; }
    table.grid.dense td.ref { white-space: nowrap; }
    table.grid.dense .pill, table.grid.dense .level { font-size: 6.2pt; padding: 0.02cm 0.12cm; white-space: normal; }
    table.grid .desc { display: block; font-size: 7.5pt; color: #64748B; margin-top: 0.03cm; }

    .pill { display: inline-block; padding: 0.02cm 0.18cm; border-radius: 9999px; font-size: 7pt; font-weight: 600; color: #FFFFFF; white-space: nowrap; background: #64748B; }
    .pill.neutral { color: #334155; background: #E2E8F0; }
    .pill.bad { background: #DC2626; }
    .level { display: inline-block; padding: 0.02cm 0.18cm; border-radius: 4px; font-size: 7pt; font-weight: 700; color: #1E293B; white-space: nowrap; }
    .dot { display: inline-block; width: 0.18cm; height: 0.18cm; border-radius: 9999px; margin-right: 0.08cm; vertical-align: 0; }
    .empty { border: 1px dashed #CBD5E1; border-radius: 6px; padding: 0.25cm 0.35cm; color: #64748B; }

    html[dir="rtl"] th, html[dir="rtl"] table.grid .num { text-align: right; }
    html[dir="rtl"] ul { padding-left: 0; padding-right: 0.45cm; }
    html[dir="rtl"] .report-header .title { text-align: left; }
    html[dir="rtl"] .chapter-band .num { margin-right: 0; margin-left: 0.2cm; }
    html[dir="rtl"] .chapter-band .stats { float: left; }
    html[dir="rtl"] .legend span.item { margin-right: 0; margin-left: 0.45cm; }
    html[dir="rtl"] .swatch, html[dir="rtl"] .dot { margin-right: 0; margin-left: 0.08cm; }
    html[dir="rtl"] .section-title .n { margin-right: 0; margin-left: 0.12cm; }
    html[dir="rtl"] .eyebrow, html[dir="rtl"] table.grid thead th, html[dir="rtl"] table.meta .label { letter-spacing: 0; }
</style>
