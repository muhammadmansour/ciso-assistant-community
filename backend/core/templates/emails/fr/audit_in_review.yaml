subject: "Wathbah GRC : statut de l'audit passé à En revue — '${assessment_name}'"
body: |
  Bonjour,

  Le statut de l'audit suivant a changé et nécessite désormais votre revue.

  Détails de l'audit :
  - Nom : ${assessment_name}
  - Référentiel : ${framework_name}
  - Domaine : ${folder_name}

  Changement de statut : ${old_status} → ${new_status}

  En tant que relecteur, veuillez ouvrir l'audit et effectuer votre revue :
  ${assessment_url}

  Merci.
