subject: "Wathbah GRC : revue de l'audit rejetée — '${assessment_name}'"
body: |
  Bonjour,

  Le statut de l'audit suivant a changé. La revue n'a pas été validée et l'audit a été renvoyé pour correction.

  Détails de l'audit :
  - Nom : ${assessment_name}
  - Référentiel : ${framework_name}
  - Domaine : ${folder_name}

  Changement de statut : ${old_status} → ${new_status}

  En tant qu'auteur, veuillez traiter les retours du relecteur et soumettre à nouveau l'audit :
  ${assessment_url}

  Merci.
