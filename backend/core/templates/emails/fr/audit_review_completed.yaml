subject: "Wathbah GRC : revue de l'audit terminée — '${assessment_name}'"
body: |
  Bonjour,

  Le statut de l'audit suivant a changé suite à une revue concluante.

  Détails de l'audit :
  - Nom : ${assessment_name}
  - Référentiel : ${framework_name}
  - Domaine : ${folder_name}

  Changement de statut : ${old_status} → ${new_status}

  L'audit est désormais marqué comme Terminé. Ouvrez-le pour consulter le résultat :
  ${assessment_url}

  Merci.
