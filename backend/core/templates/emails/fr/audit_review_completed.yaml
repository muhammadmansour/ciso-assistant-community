body: |
  Bonjour,

  Le statut de l'audit suivant a changé à la suite d'une revue concluante :

  - Nom : ${assessment_name}
  - Référentiel : ${framework_name}
  - Domaine : ${folder_name}
  - Changement de statut : ${old_status} → ${new_status}

  L'audit est désormais marqué comme Terminé. Ouvrez-le dans Wathbah GRC pour consulter le résultat :
  ${assessment_url}

  Merci.
