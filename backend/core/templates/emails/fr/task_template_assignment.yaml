subject: "Muhkam: Vous avez été affecté à '${task_name}'"
intro: "Vous avez été affecté à la tâche suivante."
action: "Ouvrez la tâche dans Muhkam pour mettre à jour son statut, son observation ou son affectation."
details_heading: "Détails de la tâche"
name_label: "Nom"
description_label: "Description"
ref_id_label: "ID de référence"
task_date_label: "Date"
recurrent_label: "Récurrente"
observation_label: "Observation"
domain_label: "Domaine"
cta_label: "Ouvrir la tâche"
greeting: "Bonjour,"
closing: "Merci."
body: |
  Bonjour,

  Vous avez été affecté à la tâche suivante :

  - Nom : ${task_name}
  - Description : ${task_description}
  - ID de référence : ${task_ref_id}
  - Date : ${task_date}
  - Récurrente : ${is_recurrent}
  - Observation : ${task_observation}
  - Domaine : ${folder_name}

  Ouvrez la tâche dans Muhkam :
  ${ciso_assistant_url}/task-templates/${task_id}

  Merci.
