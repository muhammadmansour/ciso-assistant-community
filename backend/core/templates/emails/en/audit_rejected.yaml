subject: "Wathbah GRC: Audit review rejected — '${assessment_name}'"
body: |
  Hello,

  The status of the following Audit has changed. The review did not pass and the audit has been sent back for rework.

  Audit details:
  - Name: ${assessment_name}
  - Framework: ${framework_name}
  - Domain: ${folder_name}

  Status change: ${old_status} → ${new_status}

  As an author, please address the reviewer's feedback and resubmit the audit:
  ${assessment_url}

  Thank you.
