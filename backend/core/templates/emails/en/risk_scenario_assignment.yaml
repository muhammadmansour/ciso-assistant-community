body: |
  Hello,

  You have been assigned as an owner of the following Risk Scenario:

  - Name: ${scenario_name}
  - Description: ${scenario_description}
  - Reference ID: ${scenario_ref_id}
  - Risk assessment: ${risk_assessment_name}
  - Treatment: ${scenario_treatment}
  - Domain: ${folder_name}

  Open the scenario in Muhkam:
  ${ciso_assistant_url}/risk-scenarios/${scenario_id}

  Thank you.
