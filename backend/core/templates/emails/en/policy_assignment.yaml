subject: "Muhkam: You have been assigned to policy '${policy_name}'"
intro: "You have been assigned as an owner of the following Policy."
action: "Open the policy in Muhkam to review or update its details."
details_heading: "Policy details"
name_label: "Name"
description_label: "Description"
ref_id_label: "Reference ID"
status_label: "Status"
priority_label: "Priority"
eta_label: "ETA"
domain_label: "Domain"
cta_label: "Open policy"
greeting: "Hello,"
closing: "Thank you."
body: |
  Hello,

  You have been assigned as an owner of the following Policy:

  - Name: ${policy_name}
  - Description: ${policy_description}
  - Reference ID: ${policy_ref_id}
  - Status: ${policy_status}
  - Priority: ${policy_priority}
  - ETA: ${policy_eta}
  - Domain: ${folder_name}

  Open the policy in Muhkam:
  ${ciso_assistant_url}/policies/${policy_id}

  Thank you.
