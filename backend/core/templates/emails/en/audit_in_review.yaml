subject: "Wathbah GRC: Audit status changed to In Review — '${assessment_name}'"
body: |
  Hello,

  The status of the following Audit has changed and now requires your review.

  Audit details:
  - Name: ${assessment_name}
  - Framework: ${framework_name}
  - Domain: ${folder_name}

  Status change: ${old_status} → ${new_status}

  As a reviewer, please open the audit and complete your review:
  ${assessment_url}

  Thank you.
