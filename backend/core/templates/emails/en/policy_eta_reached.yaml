subject: "Muhkam: Policy '${policy_name}' has reached its ETA"
intro: "A policy assigned to you has reached its ETA while still in progress."
action: "Open the policy in Muhkam to move it forward or update its ETA."
details_heading: "Policy details"
name_label: "Name"
description_label: "Description"
ref_id_label: "Reference ID"
status_label: "Status"
priority_label: "Priority"
eta_label: "ETA"
