subject: "Muhkam: You have been assigned to exception '${exception_name}'"
intro: "You have been assigned as an owner of the following Security Exception."
action: "Open the exception in Muhkam to review the justification, approver and expiry."
details_heading: "Exception details"
name_label: "Name"
description_label: "Description"
ref_id_label: "Reference ID"
severity_label: "Severity"
status_label: "Status"
expiration_label: "Expiration date"
domain_label: "Domain"
cta_label: "Open exception"
greeting: "Hello,"
closing: "Thank you."
body: |
  Hello,

  You have been assigned as an owner of the following Security Exception:

  - Name: ${exception_name}
  - Description: ${exception_description}
  - Reference ID: ${exception_ref_id}
  - Severity: ${exception_severity}
  - Status: ${exception_status}
  - Expiration date: ${exception_expiration_date}
  - Domain: ${folder_name}

  Open the exception in Muhkam:
  ${ciso_assistant_url}/security-exceptions/${exception_id}

  Thank you.
