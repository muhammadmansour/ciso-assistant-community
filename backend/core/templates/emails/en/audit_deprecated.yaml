subject: "Wathbah GRC: Audit status changed to Deprecated — '${assessment_name}'"
body: |
  Hello,

  The status of the following Audit has changed and it is no longer active.

  Audit details:
  - Name: ${assessment_name}
  - Framework: ${framework_name}
  - Domain: ${folder_name}

  Status change: ${old_status} → ${new_status}

  Open the audit for details:
  ${assessment_url}

  Thank you.
