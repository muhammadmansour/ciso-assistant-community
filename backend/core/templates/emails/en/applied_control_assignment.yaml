subject: "Wathbah GRC: You have been assigned to '${control_name}'"
intro: "You have been assigned as an owner of the following Applied Control."
action: "Open the control in Wathbah GRC to update its status, evidences or owners."
details_heading: "Control details"
name_label: "Name"
description_label: "Description"
ref_id_label: "Reference ID"
status_label: "Status"
priority_label: "Priority"
eta_label: "ETA"
domain_label: "Domain"
cta_label: "Open control"
greeting: "Hello,"
closing: "Thank you."
body: |
  Hello,

  You have been assigned as an owner of the following Applied Control:

  - Name: ${control_name}
  - Description: ${control_description}
  - Reference ID: ${control_ref_id}
  - Status: ${control_status}
  - Priority: ${control_priority}
  - ETA: ${control_eta}
  - Domain: ${folder_name}

  Open the control in Wathbah GRC:
  ${ciso_assistant_url}/applied-controls/${control_id}

  Thank you.
