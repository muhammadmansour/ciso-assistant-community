subject: "Wathbah GRC: You have been assigned to metric '${metric_name}'"
intro: "You have been assigned as an owner of the following Metric Instance."
action: "Open the metric in Wathbah GRC to log a new sample or adjust the target."
details_heading: "Metric details"
name_label: "Name"
description_label: "Description"
ref_id_label: "Reference ID"
status_label: "Status"
target_value_label: "Target value"
frequency_label: "Collection frequency"
domain_label: "Domain"
cta_label: "Open metric"
greeting: "Hello,"
closing: "Thank you."
body: |
  Hello,

  You have been assigned as an owner of the following Metric Instance:

  - Name: ${metric_name}
  - Description: ${metric_description}
  - Reference ID: ${metric_ref_id}
  - Status: ${metric_status}
  - Target value: ${metric_target_value}
  - Collection frequency: ${metric_collection_frequency}
  - Domain: ${folder_name}

  Open the metric in Wathbah GRC:
  ${ciso_assistant_url}/metric-instances/${metric_id}

  Thank you.
