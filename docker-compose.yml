services:
  backend:
    container_name: dev-backend
    image: ghcr.io/intuitem/ciso-assistant-community/backend:latest
    pull_policy: always
    restart: always
    environment:
      - ALLOWED_HOSTS=backend,localhost,grc.wathbah.dev
      - CSRF_TRUSTED_ORIGINS=https://localhost:9443,http://localhost:5555,https://grc.wathbah.dev
      - CISO_ASSISTANT_URL=https://localhost:9443
      - DJANGO_DEBUG=True
      - AUTH_TOKEN_TTL=7200
      - ATTACHMENT_MAX_SIZE_MB=100
      - ATTACHMENT_MAX_NAME_LENGTH=512
      - EMAIL_HOST=smtp.office365.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=mansourmuhammad37@outlook.com
      - EMAIL_HOST_PASSWORD=changeme
      - DEFAULT_FROM_EMAIL=mansourmuhammad37@outlook.com

    volumes:
      - ./dev-db:/code/db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://backend:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 100s

  huey:
    container_name: dev-huey
    image: ghcr.io/intuitem/ciso-assistant-community/backend:latest
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    environment:
      - ALLOWED_HOSTS=backend,localhost,grc.wathbah.dev
      - CSRF_TRUSTED_ORIGINS=https://localhost:9443,http://localhost:5555,https://grc.wathbah.dev
      - CISO_ASSISTANT_URL=https://localhost:9443
      - DJANGO_DEBUG=False
      - AUTH_TOKEN_TTL=7200
      - ATTACHMENT_MAX_SIZE_MB=100
      - ATTACHMENT_MAX_NAME_LENGTH=512
      - EMAIL_HOST=smtp.office365.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=mansourmuhammad37@outlook.com
      - EMAIL_HOST_PASSWORD=changeme
      - DEFAULT_FROM_EMAIL=mansourmuhammad37@outlook.com

    volumes:
      - ./dev-db:/code/db
    entrypoint:
      - /bin/sh
      - -c
      - |
        poetry run python manage.py run_huey -w 2 --scheduler-interval 60

  frontend:
    container_name: dev-frontend
    environment:
      - PUBLIC_BACKEND_API_URL=http://backend:8000/api
      - PUBLIC_BACKEND_API_EXPOSED_URL=https://localhost:9443/api
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    image: ghcr.io/intuitem/ciso-assistant-community/frontend:latest
    pull_policy: always
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    container_name: dev-caddy
    image: caddy:2.10.0
    environment:
      - CISO_ASSISTANT_URL=https://localhost:9443
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - 9443:9443
    volumes:
      - ./dev-caddy_data:/data
    command: |
      sh -c 'echo $$CISO_ASSISTANT_URL "{
      reverse_proxy /api/* backend:8000
      reverse_proxy /* frontend:3000
      tls internal
      }" > Caddyfile && caddy run'
